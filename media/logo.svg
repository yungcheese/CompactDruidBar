<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#21402e"/>
      <stop offset="1" stop-color="#0c1912"/>
    </linearGradient>
    <linearGradient id="paw" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffd76e"/>
      <stop offset="1" stop-color="#f0861f"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.42" r="0.5">
      <stop offset="0" stop-color="#5fe3ff" stop-opacity="0.32"/>
      <stop offset="1" stop-color="#5fe3ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="energy" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffe066"/>
      <stop offset="1" stop-color="#e8b400"/>
    </linearGradient>
    <linearGradient id="mana" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4f8dff"/>
      <stop offset="1" stop-color="#2459d6"/>
    </linearGradient>
    <clipPath id="tile">
      <rect x="16" y="16" width="480" height="480" rx="96"/>
    </clipPath>
  </defs>

  <!-- Background tile -->
  <rect x="16" y="16" width="480" height="480" rx="96" fill="url(#bg)"/>
  <rect x="19" y="19" width="474" height="474" rx="93" fill="none" stroke="#4a7d5d" stroke-width="6"/>
  <circle cx="256" cy="196" r="200" fill="url(#glow)" clip-path="url(#tile)"/>

  <!-- Paw -->
  <g fill="url(#paw)" stroke="#5a2e05" stroke-opacity="0.35" stroke-width="4">
    <ellipse cx="160" cy="158" rx="36" ry="46" transform="rotate(-22 160 158)"/>
    <ellipse cx="222" cy="104" rx="36" ry="48" transform="rotate(-7 222 104)"/>
    <ellipse cx="290" cy="104" rx="36" ry="48" transform="rotate(7 290 104)"/>
    <ellipse cx="352" cy="158" rx="36" ry="46" transform="rotate(22 352 158)"/>
    <path d="M256 176 C 318 176 370 226 370 274 C 370 310 338 324 308 318 C 288 314 273 305 256 305 C 239 305 224 314 204 318 C 174 324 142 310 142 274 C 142 226 194 176 256 176 Z"/>
  </g>

  <!-- Energy bar -->
  <rect x="92" y="346" width="328" height="36" rx="6" fill="#070d09" stroke="#000" stroke-width="3"/>
  <rect x="96" y="350" width="236" height="28" rx="3" fill="url(#energy)"/>
  <rect x="246" y="350" width="4" height="28" fill="#ffffff" opacity="0.95"/>

  <!-- Combo points -->
  <g stroke="#000" stroke-width="3">
    <rect x="92"  y="392" width="58" height="18" rx="3" fill="#ff7a1a"/>
    <rect x="160" y="392" width="58" height="18" rx="3" fill="#ff7a1a"/>
    <rect x="228" y="392" width="58" height="18" rx="3" fill="#ff7a1a"/>
    <rect x="296" y="392" width="58" height="18" rx="3" fill="#070d09"/>
    <rect x="364" y="392" width="56" height="18" rx="3" fill="#070d09"/>
  </g>

  <!-- Mana bar with powershift marks -->
  <rect x="92" y="420" width="328" height="22" rx="4" fill="#070d09" stroke="#000" stroke-width="3"/>
  <rect x="95" y="423" width="210" height="16" rx="2" fill="url(#mana)"/>
  <g fill="#000" opacity="0.85">
    <rect x="160" y="423" width="3" height="16"/>
    <rect x="226" y="423" width="3" height="16"/>
    <rect x="292" y="423" width="3" height="16"/>
    <rect x="358" y="423" width="3" height="16"/>
  </g>
</svg>
