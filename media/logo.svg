<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <radialGradient id="bg" cx="0.45" cy="0.55" r="0.75">
      <stop offset="0" stop-color="#0d3a4a"/>
      <stop offset="0.55" stop-color="#06202c"/>
      <stop offset="1" stop-color="#020a10"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff0b8"/>
      <stop offset="0.3" stop-color="#e2b45a"/>
      <stop offset="0.65" stop-color="#9c6a1e"/>
      <stop offset="1" stop-color="#f1cf7a"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5a3a0c"/>
      <stop offset="1" stop-color="#b8862e"/>
    </linearGradient>
    <radialGradient id="pad" cx="0.45" cy="0.35" r="0.75">
      <stop offset="0" stop-color="#1f4fa8"/>
      <stop offset="0.6" stop-color="#0c2560"/>
      <stop offset="1" stop-color="#06143a"/>
    </radialGradient>
    <radialGradient id="gem" cx="0.35" cy="0.35" r="0.7">
      <stop offset="0" stop-color="#d8fbff"/>
      <stop offset="0.45" stop-color="#3cc9ff"/>
      <stop offset="1" stop-color="#0a4a8a"/>
    </radialGradient>
    <linearGradient id="slash" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#e9ffff" stop-opacity="0"/>
      <stop offset="0.35" stop-color="#9ff6ff"/>
      <stop offset="1" stop-color="#2ad8ff"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
    <filter id="glowSoft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="26"/>
    </filter>
    <clipPath id="inside"><rect x="40" y="40" width="432" height="432" rx="18"/></clipPath>

    <!-- Paw (one group so it can be drawn as glow, rim and fill) -->
    <g id="paw">
      <path d="M256 236 C306 236 352 280 356 326 C360 368 330 386 300 380 C282 376 270 368 256 368 C242 368 230 376 212 380 C182 386 152 368 156 326 C160 280 206 236 256 236 Z"/>
      <ellipse cx="164" cy="214" rx="30" ry="40" transform="rotate(-28 164 214)"/>
      <ellipse cx="220" cy="160" rx="31" ry="43" transform="rotate(-9 220 160)"/>
      <ellipse cx="292" cy="160" rx="31" ry="43" transform="rotate(9 292 160)"/>
      <ellipse cx="348" cy="214" rx="30" ry="40" transform="rotate(28 348 214)"/>
    </g>

    <!-- Three claw slashes (tapered) -->
    <g id="slashes">
      <path d="M318 70 C368 128 404 196 424 276 C396 206 360 144 306 84 Z"/>
      <path d="M362 62 C410 120 444 186 458 262 C434 196 400 136 350 76 Z"/>
      <path d="M276 84 C322 136 354 196 372 262 C346 202 316 150 266 98 Z"/>
    </g>
  </defs>

  <!-- Outer gold bevel frame -->
  <rect x="10" y="10" width="492" height="492" rx="36" fill="url(#goldDark)"/>
  <rect x="16" y="16" width="480" height="480" rx="32" fill="url(#gold)"/>
  <rect x="32" y="32" width="448" height="448" rx="22" fill="#2a1a05"/>
  <rect x="40" y="40" width="432" height="432" rx="18" fill="url(#bg)"/>

  <g clip-path="url(#inside)">
    <!-- Ambient magic glow -->
    <circle cx="256" cy="290" r="170" fill="#1fd6e0" opacity="0.28" filter="url(#glowSoft)"/>

    <!-- Claw slashes behind the paw, larger -->
    <g transform="translate(-150 -40) scale(1.45)">
      <use href="#slashes" fill="#38e6ff" opacity="0.8" filter="url(#glow)"/>
      <use href="#slashes" fill="url(#slash)" opacity="0.95"/>
    </g>

    <!-- Paw: outer glow, bright rim, dark-blue fill -->
    <use href="#paw" fill="#3ff0ff" opacity="0.85" filter="url(#glow)"/>
    <use href="#paw" fill="none" stroke="#7ff8ff" stroke-width="12"/>
    <use href="#paw" fill="url(#pad)" stroke="#d4feff" stroke-width="3"/>


    <!-- Sparks -->
    <g fill="#bffcff">
      <circle cx="120" cy="120" r="4"/><circle cx="96" cy="300" r="3"/><circle cx="410" cy="380" r="4"/>
      <circle cx="150" cy="420" r="3"/><circle cx="380" cy="120" r="2.5"/><circle cx="200" cy="96" r="2.5"/>
    </g>

    <!-- Inner vignette edge -->
    <rect x="40" y="40" width="432" height="432" rx="18" fill="none" stroke="#000" stroke-opacity="0.55" stroke-width="10"/>
  </g>

  <!-- Gold inner rim -->
  <rect x="40" y="40" width="432" height="432" rx="18" fill="none" stroke="#f3d38a" stroke-width="3"/>

  <!-- Corner gems -->
  <g stroke="#4a2e06" stroke-width="3">
    <g transform="translate(40 40) rotate(45)"><rect x="-17" y="-17" width="34" height="34" fill="url(#gold)"/><rect x="-10" y="-10" width="20" height="20" fill="url(#gem)"/></g>
    <g transform="translate(472 40) rotate(45)"><rect x="-17" y="-17" width="34" height="34" fill="url(#gold)"/><rect x="-10" y="-10" width="20" height="20" fill="url(#gem)"/></g>
    <g transform="translate(40 472) rotate(45)"><rect x="-17" y="-17" width="34" height="34" fill="url(#gold)"/><rect x="-10" y="-10" width="20" height="20" fill="url(#gem)"/></g>
    <g transform="translate(472 472) rotate(45)"><rect x="-17" y="-17" width="34" height="34" fill="url(#gold)"/><rect x="-10" y="-10" width="20" height="20" fill="url(#gem)"/></g>
  </g>
</svg>
