<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="ring" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f7e09a"/><stop offset="0.45" stop-color="#c8963a"/><stop offset="1" stop-color="#6e4a14"/>
    </linearGradient>
    <radialGradient id="sky" cx="0.5" cy="0.38" r="0.68">
      <stop offset="0" stop-color="#4b3283"/><stop offset="0.65" stop-color="#25174a"/><stop offset="1" stop-color="#110a24"/>
    </radialGradient>
    <radialGradient id="aura" cx="0.5" cy="0.55" r="0.5">
      <stop offset="0" stop-color="#b48cff" stop-opacity="0.45"/><stop offset="1" stop-color="#b48cff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="maneOuter" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8a4a1c"/><stop offset="1" stop-color="#3e1d08"/>
    </linearGradient>
    <linearGradient id="maneInner" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b8682a"/><stop offset="1" stop-color="#6a3312"/>
    </linearGradient>
    <linearGradient id="fur" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc165"/><stop offset="1" stop-color="#d47a22"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff6de"/><stop offset="1" stop-color="#b9a170"/>
    </linearGradient>
    <radialGradient id="eye" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fffbd0"/><stop offset="0.6" stop-color="#ffe14a"/><stop offset="1" stop-color="#f0a800"/>
    </radialGradient>
    <mask id="moon"><circle cx="372" cy="128" r="46" fill="#fff"/><circle cx="352" cy="114" r="40" fill="#000"/></mask>
    <radialGradient id="eyeGlow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#ffe14a" stop-opacity="0.7"/><stop offset="1" stop-color="#ffe14a" stop-opacity="0"/></radialGradient>
    <clipPath id="inner"><circle cx="256" cy="256" r="214"/></clipPath>
  </defs>

  <!-- Medallion -->
  <circle cx="256" cy="256" r="244" fill="url(#ring)"/>
  <circle cx="256" cy="256" r="230" fill="none" stroke="#5a3a0e" stroke-width="3"/>
  <circle cx="256" cy="256" r="214" fill="url(#sky)" stroke="#3b2608" stroke-width="5"/>

  <g clip-path="url(#inner)">
